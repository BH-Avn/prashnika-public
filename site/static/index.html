<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Exam Questions</title>
<meta name="description" content="Past exam questions by subject, year, paper and chapter.">
<meta property="og:type" content="website">
<meta property="og:title" content="Past Exam Questions">
<meta property="og:description" content="Past exam questions by subject, year, paper and chapter.">
<link rel="stylesheet" href="/static/site.css">
<script>document.documentElement.classList.add(location.search === "" ? "is-home" : "is-list");</script>
<script defer src="/static/vendor/rich-text.js"></script>
<script defer src="/static/words.js"></script>
<script defer src="/static/site.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/">Question bank</a>
  <nav class="topnav" aria-label="Site">
    <a href="/" data-nav="home">Home</a>
    <a href="/?view=questions" data-nav="questions">Questions</a>
    <a href="/papers" data-nav="papers">Papers</a>
    <a href="/isc" data-nav="subjects">Subjects</a>
    <a href="/chapters" data-nav="chapters">Chapters</a>
  </nav>
  <form class="tsearch" action="/" method="get" role="search">
    <input type="search" name="q" placeholder="Search questions" aria-label="Search every question" autocomplete="off">
  </form>
</header>

<main>
  <div id="main"><p class="muted pad">Loading…</p></div>
<!--HOME-->
</main>

<footer class="foot">
  <p>Code sample from a question bank. Questions shown on a real deployment belong to their owners.
    <a href="/about">About</a> · <a href="/privacy">Privacy</a></p>
</footer>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <button id="dialog-close" type="button" aria-label="Close">Close</button>
      <div id="dialog-title" class="dialog-title"></div>
      <span id="dialog-count" class="dialog-count"></span>
      <a id="dialog-page" href="/" aria-label="Open this question on its own page">Open page</a>
      <div class="dialog-nav">
        <button id="dialog-prev-top" type="button" data-step="prev" aria-label="Previous question">‹</button>
        <button id="dialog-next-top" type="button" data-step="next" aria-label="Next question">›</button>
      </div>
    </div>
    <div class="dialog-rail"><div id="dialog-progress"></div></div>
    <div id="dialog-body" class="dialog-body"></div>
    <div class="dialog-foot">
      <button id="dialog-prev" type="button" data-step="prev" aria-label="Previous question">‹</button>
      <button id="dialog-next" type="button" data-step="next" aria-label="Next question">›</button>
    </div>
  </div>
</div>

</body>
</html>
